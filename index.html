<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Scene Layout Fix</title>
    
    <style>
      /* Force full screen sizing so the 3D Canvas has room to expand */
      html, body, #root {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #121212 !important; /* Deep dark background */
        overflow: hidden;
      }
      
      #error-display {
        position: absolute;
        top: 10px;
        left: 10px;
        right: 10px;
        background: #ef4444;
        color: white;
        padding: 15px;
        border-radius: 6px;
        z-index: 9999;
        display: none;
        word-break: break-all;
        font-family: sans-serif;
      }
    </style>

    <script>
      function logErrorToScreen(type, message) {
        window.addEventListener('DOMContentLoaded', () => {
          const box = document.getElementById('error-display');
          if (box) {
            box.style.display = 'block';
            box.innerHTML += `<div><strong>[${type}]</strong> ${message}</div>`;
          }
        });
        alert(`[${type}] ${message}`);
      }

      window.onerror = function(message, source, lineno) {
        logErrorToScreen("JS Error", message + " (Line " + lineno + ")");
        return false;
      };

      window.addEventListener('unhandledrejection', function(event) {
        logErrorToScreen("Async Error", event.reason);
      });
    </script>
  </head>
  <body>
    <div id="error-display"></div>
    <div id="root"></div>
    
    <script 
      type="module" 
      src="/index.jsx"
      onerror="logErrorToScreen('Network Error', 'The browser failed to load /index.jsx. Check your file path structure.')"
    ></script>
  </body>
</html>
